server {
    listen 80;
    listen [::]:80;
    server_name nbcc.example.com;
    root /var/www/nbcc-whatsapp;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
