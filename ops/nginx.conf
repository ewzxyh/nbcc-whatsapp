server {
    listen 80;
    listen [::]:80;
    server_name nbcc.example.com;
    root /var/www/nbcc-whatsapp;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nbcc.example.com;
    ssl_certificate /etc/letsencrypt/live/nbcc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nbcc.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;

    access_log /var/log/nginx/nbcc-whatsapp-access.log;
    error_log /var/log/nginx/nbcc-whatsapp-error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_max_temp_file_size 0;
    }
}
